services:
  - type: web
    name: football-analysis
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120 --workers 1 --preload
    envVars:
      - key: FOOTYSTATS_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
